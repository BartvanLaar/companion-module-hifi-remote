name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  package:
    name: Package module

    # The template itself cannot be packaged, as its manifest still holds placeholders
    if: ${{ !contains(github.repository, 'companion-module-template-') }}

    permissions:
      contents: read
      packages: read

    uses: bitfocus/actions/.github/workflows/module-checks.yaml@main
    with:
      git-ref: ${{ github.ref_name }}
      # Tags like v1.2.0-beta.1 are prereleases
      prerelease: ${{ contains(github.ref_name, '-') }}
      upload-artifact: true

  release:
    name: Create release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Needed to create the release
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          # The shared workflow always uploads its package as 'pkg', holding pkg.tgz
          name: pkg
      - name: Create release with the package attached
        # Releases are immutable once published, so the package has to be
        # attached when the release is created. gh is preinstalled on the
        # runner, so this needs no third party action.
        run: |
          NAME="${GITHUB_REPOSITORY#*/companion-module-}-${TAG#v}"
          ASSET="${NAME//[^a-zA-Z0-9.-]/-}.tgz"
          mv pkg.tgz "$ASSET"
          EXTRA_ARGS=()
          if [[ "$TAG" == *-* ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "$ASSET" --verify-tag --title "$TAG" \
            --generate-notes "${EXTRA_ARGS[@]}" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
